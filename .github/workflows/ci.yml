# The package's CI: glitchr-studio/ci's reusable workflow (the PHP 8.4 image, the package installed
# alone, PHPUnit, PHPStan against phpstan-baseline.neon, a consumer install without require-dev), then
# the master plan's phase 2 gate: a clean job produces a static artifact with the plain PHP command
# line, verifies it (checksums, no error, two builds identical) and keeps it; the same site is built
# for GitHub Pages under a folder of its origin.
name: ci

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    uses: glitchr-studio/ci/.github/workflows/php-package.yml@main
    with:
      smoke-class: 'Omnibridge\Static\Exporter'

  export:
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - uses: actions/checkout@v4
      - name: 'Build the example site (strict: a warning fails)'
        working-directory: examples/plain
        run: php ../../bin/omnibridge-static build site.php --out=dist --strict --verify
      - name: Check the export against its report
        working-directory: examples/plain
        run: php ../../bin/omnibridge-static check dist
      - name: A second build is the same
        working-directory: examples/plain
        run: |
          php ../../bin/omnibridge-static build site.php --out=dist-2 --quiet
          cmp dist/omnibridge-static.json dist-2/omnibridge-static.json
      - name: The same site for GitHub Pages, under a folder of its origin (every address moved, none outside)
        working-directory: examples/plain
        env:
          STATIC_ORIGIN: https://owner.github.io/example/
        run: |
          php ../../bin/omnibridge-static build site.php --out=dist-pages --target=github-pages --strict
          php ../../bin/omnibridge-static check dist-pages
          test -f dist-pages/.nojekyll && test ! -e dist-pages/_redirects
          grep -q 'href="/example/posts/hello"' dist-pages/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: example-static-site
          path: examples/plain/dist
